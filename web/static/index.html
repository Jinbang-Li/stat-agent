<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>县域经济统计分析 Agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="1" width="24" height="24" rx="6" fill="#2456a6"/>
      <path d="M6 18 L11 12 L15 15 L20 8" fill="none" stroke="#fff" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="8" r="2" fill="#9ec1ff"/>
    </svg>
    <div>
      <h1>县域经济统计分析 Agent</h1>
      <p>自然语言取数 · 自动统计方法路由 · 结论带显著性检验</p>
    </div>
  </div>
  <div class="pills" id="pills">
    <span class="pill muted">连接中…</span>
  </div>
</header>

<nav class="viewtabs" id="viewtabs">
  <button class="viewtab active" data-view="ask">分析</button>
  <button class="viewtab" data-view="history">历史记录</button>
</nav>

<main>
  <section class="card query" id="askview">
    <div class="q-head">
      <label for="q">提问</label>
      <span class="q-tip">Ctrl / ⌘ + Enter 提交</span>
    </div>
    <textarea id="q" rows="3" maxlength="500"
      placeholder="例如：贫困县和非贫困县的居民收入有显著差异吗"></textarea>
    <div class="q-actions">
      <div class="samples" id="samples"></div>
      <div class="q-buttons">
        <label class="upload" id="uploadlabel" title="支持 .xlsx / .xls，首个工作表">
          <input type="file" id="file" accept=".xlsx,.xls" hidden>
          <span id="uploadtext">上传 Excel 分析</span>
        </label>
        <button id="ask" class="primary">分析</button>
      </div>
    </div>
    <p class="q-hint">
      支持：数值查询、描述统计、相关检验、分组比较、时序预测、聚类、异常诊断。
      样本不足或前提不满足时会拒绝建模并说明原因。上传 Excel 时，表格会走与数据库查询相同的分析链路。
    </p>
  </section>

  <section class="card hidden" id="result">
    <div class="stages" id="stages"></div>

    <div class="charts" id="charts"></div>

    <div class="report" id="report"></div>

    <div class="tabs">
      <div class="tabbar" id="tabbar">
        <button class="tab active" data-tab="sql">SQL 与校验</button>
        <button class="tab" data-tab="data">数据预览</button>
        <button class="tab" data-tab="plan">决策轨迹</button>
        <button class="tab" data-tab="meta">运行信息</button>
      </div>
      <div class="tabpanel" id="panel-sql"></div>
      <div class="tabpanel hidden" id="panel-data"></div>
      <div class="tabpanel hidden" id="panel-plan"></div>
      <div class="tabpanel hidden" id="panel-meta"></div>
    </div>

    <div class="footnote" id="footnote"></div>
  </section>

  <section class="card hidden" id="errorbox"></section>

  <section class="card hidden" id="historyview">
    <div class="hist-head">
      <div>
        <h2>历史记录</h2>
        <p class="hist-sub" id="histsub">最近 20 条查询，点开可回看当时的完整报告与图表。</p>
      </div>
      <button class="ghost" id="histrefresh">刷新</button>
    </div>
    <div id="histlist"></div>
  </section>
</main>

<footer class="page-foot">
  <span>所有统计量由 Python 计算（scipy / statsmodels），模型只负责理解问题与撰写解读；报告中的每个数字都会与计算结果逐一核对。</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
